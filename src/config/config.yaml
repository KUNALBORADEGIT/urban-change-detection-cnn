data:
  root_dir: "data/LEVIR CD"
  img_size: [256, 256]

model:
  base_channels: 32

train:
  use_cuda: true
  batch_size: 8
  num_workers: 2
  epochs: 20
  lr: 0.0003
  weight_decay: 0.01
  threshold: 0.5

  loss: "dice_bce"   # "bce" or "dice_bce"
  bce_weight: 0.5

  out_dir: "runs/unet_baseline"